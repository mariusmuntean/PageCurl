name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    # This lane evaluates only net10.0; native workload pins belong to mobile.
    env:
      MSBuildEnableWorkloadResolver: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Run platform-free tests
        run: dotnet run --project tests/PageCurl.Core.Tests/PageCurl.Core.Tests.csproj -c Release
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Check workflow syntax and expressions
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -shellcheck= -pyflakes=
      - name: Verify validation tooling
        run: |
          bash tools/check-workflow-projects.sh
          python3 -m unittest discover -s tools/tests -p 'test_*.py'
          node --test tests/computer-control/pagecurl-checks.test.js
      - name: Compile documented examples
        run: bash tools/test-quick-start.sh
      - name: Verify isolated public package consumer
        run: bash tools/test-package-consumer.sh

  mobile:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Select Xcode 27.0
        run: sudo xcode-select --switch /Applications/Xcode_27.0.app/Contents/Developer
      - name: Select Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Install MAUI workloads
        run: dotnet workload install maui-ios maui-maccatalyst maui-android
      - name: Run platform-free tests
        run: dotnet run --project tests/PageCurl.Core.Tests/PageCurl.Core.Tests.csproj -c Release
      - name: Build neutral MAUI target
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore src/PageCurl.Maui/PageCurl.Maui.csproj -p:TargetFrameworks=net10.0
          dotnet restore src/PageCurl.Core/PageCurl.Core.csproj -p:TargetFrameworks=net10.0
          dotnet build src/PageCurl.Maui/PageCurl.Maui.csproj -c Release -f net10.0 -p:TargetFrameworks=net10.0 --no-restore
      - name: Run neutral MAUI tests
        run: dotnet run --project tests/PageCurl.Maui.Tests/PageCurl.Maui.Tests.csproj -c Release -f net10.0
      - name: Build native regression fixture
        run: dotnet build tests/PageCurl.Apple.Tests/PageCurl.Apple.Tests.csproj -c Release -f net10.0-maccatalyst -p:RuntimeIdentifier=maccatalyst-arm64
      - name: Run native regression assertions
        run: python3 tools/run-native-fixture.py tests/PageCurl.Apple.Tests/bin/Release/net10.0-maccatalyst/maccatalyst-arm64/PageCurl.Apple.Tests.app/Contents/MacOS/PageCurl.Apple.Tests
      - name: Retain native assertion evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-assertions
          path: .artifacts/native-tests.log
          include-hidden-files: true
          if-no-files-found: warn
      - name: Build iOS simulator demo
        run: dotnet build src/PageCurl.Demo/PageCurl.Demo.csproj -c Release -f net10.0-ios -p:RuntimeIdentifier=iossimulator-arm64
      - name: Build Android demo
        run: dotnet build src/PageCurl.Demo/PageCurl.Demo.csproj -c Release -f net10.0-android
      - name: Build Mac Catalyst demo
        run: dotnet build src/PageCurl.Demo/PageCurl.Demo.csproj -c Release -f net10.0-maccatalyst -p:RuntimeIdentifier=maccatalyst-arm64
      - name: Pack Core package
        run: dotnet pack src/PageCurl.Core/PageCurl.Core.csproj -c Release --no-build --output .artifacts/packages
      - name: Pack native library assets
        run: dotnet pack src/PageCurl.Maui/PageCurl.Maui.csproj -c Release --output .artifacts/packages -m:1 -nr:false
      - name: Check native package assets
        shell: bash
        run: python3 tools/check-packages.py .artifacts/packages/PageCurl.Maui.*.nupkg net10.0 net10.0-android net10.0-ios net10.0-maccatalyst
      - name: Retain macOS package inputs
        uses: actions/upload-artifact@v7
        with:
          name: packages-mobile
          path: .artifacts/packages/*.*nupkg
          include-hidden-files: true
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        # Avoid upgrading unrelated workloads from the runner image.
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/pagecurl-dotnet
        with:
          global-json-file: global.json
      - name: Install Windows MAUI workload
        run: dotnet workload install maui-windows
      - name: Restore Windows projects and neutral Core
        shell: pwsh
        run: |
          dotnet restore -p:Configuration=Release src/PageCurl.Demo/PageCurl.Demo.csproj -p:TargetFrameworks=net10.0-windows10.0.19041.0 -p:WindowsPackageType=None -p:RuntimeIdentifier=win-x64 -p:SelfContained=true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet restore -p:Configuration=Release src/PageCurl.Core/PageCurl.Core.csproj -p:TargetFrameworks=net10.0 -p:RuntimeIdentifier=win-x64 -p:SelfContained=true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Windows demo
        run: dotnet build src/PageCurl.Demo/PageCurl.Demo.csproj -c Release -f net10.0-windows10.0.19041.0 -p:TargetFrameworks=net10.0-windows10.0.19041.0 -p:WindowsPackageType=None -p:RuntimeIdentifier=win-x64 -p:SelfContained=true --no-restore -m:1 -nr:false
      - name: Pack Windows library
        run: dotnet pack src/PageCurl.Maui/PageCurl.Maui.csproj -c Release -p:TargetFrameworks=net10.0-windows10.0.19041.0 --no-restore --output .artifacts/packages -m:1 -nr:false
      - name: Check Windows package assets
        shell: pwsh
        run: |
          $package = Get-ChildItem .artifacts/packages/PageCurl.Maui.*.nupkg | Select-Object -First 1
          python tools/check-packages.py $package.FullName net10.0-windows

      - name: Pack Core for the Windows package consumer
        run: dotnet pack src/PageCurl.Core/PageCurl.Core.csproj -c Release --output .artifacts/windows-consumer-feed -m:1 -nr:false
      - name: Build isolated Windows package consumer
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem .artifacts/packages/PageCurl.Maui.*.nupkg)
          if ($packages.Count -ne 1) { throw 'Expected one Windows MAUI package.' }
          $package = $packages[0]
          $version = $package.BaseName.Substring('PageCurl.Maui.'.Length)
          Copy-Item $package.FullName .artifacts/windows-consumer-feed/
          $env:PAGECURL_PACKAGE_FEED = (Resolve-Path .artifacts/windows-consumer-feed).Path
          $consumerRoot = Join-Path $env:RUNNER_TEMP 'pagecurl-windows-consumer'
          New-Item -ItemType Directory -Path $consumerRoot -Force | Out-Null
          Copy-Item tests/PageCurl.Package.Windows.Tests/* $consumerRoot -Recurse
          Copy-Item global.json $consumerRoot
          $project = Join-Path $consumerRoot 'Consumer.csproj'
          $config = Join-Path $consumerRoot 'NuGet.Config'
          $cache = Join-Path $env:RUNNER_TEMP 'pagecurl-windows-package-cache'
          dotnet restore $project --configfile $config --packages $cache --no-cache -p:Configuration=Release -p:PageCurlVersion=$version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build $project -c Release -f net10.0-windows10.0.19041.0 -p:PageCurlVersion=$version --no-restore -m:1 -nr:false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $pri = Get-Item (Join-Path $consumerRoot 'bin/Release/net10.0-windows10.0.19041.0/win-x64/Consumer.pri') -ErrorAction Stop
          if ($pri.Length -eq 0) { throw 'Windows consumer PRI is empty.' }
          Write-Host 'PASS Windows package consumer: transitive Core, SkiaSharp registration and WinUI PRI generation'

      - name: Retain Windows package inputs
        uses: actions/upload-artifact@v7
        with:
          name: packages-windows
          path: .artifacts/packages/*.*nupkg
          include-hidden-files: true
          if-no-files-found: error

  distribution:
    needs: [core, mobile, windows]
    runs-on: ubuntu-latest
    env:
      MSBuildEnableWorkloadResolver: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Download macOS package inputs
        uses: actions/download-artifact@v8
        with:
          name: packages-mobile
          path: .artifacts/package-inputs/mobile
      - name: Download Windows package inputs
        uses: actions/download-artifact@v8
        with:
          name: packages-windows
          path: .artifacts/package-inputs/windows
      - name: Assemble complete unsigned distribution
        run: python3 tools/assemble-packages.py --output .artifacts/distribution .artifacts/package-inputs/mobile .artifacts/package-inputs/windows
      - name: Verify isolated consumer of the assembled distribution
        run: bash tools/test-package-consumer.sh .artifacts/distribution
      - name: Retain validated distribution
        uses: actions/upload-artifact@v7
        with:
          name: package-distribution
          path: .artifacts/distribution/*.*nupkg
          include-hidden-files: true
          if-no-files-found: error
