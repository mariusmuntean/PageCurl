name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Run platform-free tests
        run: dotnet run --project tests/PageCurl.Core.Tests/PageCurl.Core.Tests.csproj -c Release
      - name: Build neutral MAUI target
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore src/PageCurl.Core/PageCurl.Core.csproj -p:TargetFrameworks=net10.0
          dotnet restore src/PageCurl.Maui/PageCurl.Maui.csproj -p:TargetFrameworks=net10.0
          dotnet build src/PageCurl.Maui/PageCurl.Maui.csproj -c Release -f net10.0 --no-restore
      - name: Pack the library metadata
        shell: bash
        run: dotnet pack src/PageCurl.Maui/PageCurl.Maui.csproj -c Release -p:TargetFrameworks=net10.0 --no-restore --output .artifacts/packages

  mobile:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Select Xcode 27.0
        run: sudo xcode-select --switch /Applications/Xcode_27.0.app/Contents/Developer
      - name: Select Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install MAUI workloads
        run: dotnet workload install maui-ios maui-maccatalyst maui-android
      - name: Run platform-free tests
        run: dotnet run --project tests/PageCurl.Core.Tests/PageCurl.Core.Tests.csproj -c Release
      - name: Build neutral MAUI target
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore src/PageCurl.Maui/PageCurl.Maui.csproj -p:TargetFrameworks=net10.0
          dotnet restore src/PageCurl.Core/PageCurl.Core.csproj -p:TargetFrameworks=net10.0
          dotnet build src/PageCurl.Maui/PageCurl.Maui.csproj -c Release -f net10.0 --no-restore
      - name: Run neutral MAUI tests
        run: dotnet run --project tests/PageCurl.Maui.Tests/PageCurl.Maui.Tests.csproj -c Release
      - name: Build iOS simulator demo
        run: dotnet build src/PageCurl.Demo/PageCurl.Demo.csproj -c Release -f net10.0-ios -p:RuntimeIdentifier=iossimulator-arm64
      - name: Build Android demo
        run: dotnet build src/PageCurl.Demo/PageCurl.Demo.csproj -c Release -f net10.0-android
      - name: Build Mac Catalyst demo
        run: dotnet build src/PageCurl.Demo/PageCurl.Demo.csproj -c Release -f net10.0-maccatalyst -p:RuntimeIdentifier=maccatalyst-arm64
